services:
  db:
    image: postgres:17-alpine
    container_name: transcendence-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB} -h 127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - transcendence-net

  next-app:
    build:
      context: .
      dockerfile: srcs/Dockerfile
    container_name: transcendence-app
    restart: no
    command: sh -c "for i in 1 2 3 4 5; do npx prisma migrate deploy && break; echo 'retry migrate...'; sleep 3; done; npm run dev"
    stop_grace_period: 30s
    volumes:
      # surgical bind mounts for hot-reload
      - ./srcs/app:/app/app
      - ./srcs/components:/app/components
      - ./srcs/lib:/app/lib
      - ./srcs/hooks:/app/hooks
      - ./srcs/public:/app/public
      # prisma schema + migrations for migrate deploy at runtime
      - ./prisma:/app/prisma:ro
      # named volumes for generated/build content (fast + persistent)
      - next-modules:/app/node_modules
      - prisma-client-app:/app/generated/prisma
      - type: tmpfs
        target: /app/.next
        tmpfs:
          size: 2g
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      # NODE_OPTIONS: --max-old-space-size=2048
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - transcendence-net

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: server-backend
    restart: no
    volumes:
      - server-modules:/server/node_modules
      - prisma-client-server:/server/generated/prisma
      - ./server/sockets:/server/sockets
      - ./server/game:/server/game
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      NEXT_PUBLIC_URL: ${NEXT_PUBLIC_URL}
    ports:
      - "3001:3001"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - transcendence-net

volumes:
  db-data:
  next-modules:
  server-modules:
  #next-cache:
  prisma-client-app:
  prisma-client-server:

networks:
  transcendence-net:
