services:
  db:
    image: postgres:17-alpine
    container_name: transcendence-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB} -h 127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - transcendence-net

  next-app:
    build:
      context: .
      dockerfile: srcs/Dockerfile
    container_name: transcendence-app
    restart: no
    command: sh -c "for i in 1 2 3 4 5; do npx prisma migrate deploy && break; echo 'retry migrate...'; sleep 3; done; npm run dev"
    stop_grace_period: 5s
    volumes:
      # surgical bind mounts for hot-reload
      - ./srcs/app:/app/app
      - ./srcs/components:/app/components
      - ./srcs/lib:/app/lib
      - ./srcs/hooks:/app/hooks
      - ./srcs/public:/app/public
      # prisma schema + migrations for migrate deploy at runtime
      - ./prisma:/app/prisma:ro
      # named volumes for generated/build content (fast + persistent)
      - next-modules:/app/node_modules
      - prisma-client-app:/app/generated/prisma
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      # NODE_OPTIONS: --max-old-space-size=2048
    env_file: ".env.local"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - transcendence-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.next.rule=Host(`dice.docker.localhost`)"
      - "traefik.http.routers.next.entrypoints=websecure"
      - "traefik.http.routers.next.tls=true"
      - "traefik.http.services.next.loadbalancer.server.port=3000"

  socket:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: server-backend
    restart: no
    volumes:
      - server-modules:/server/node_modules
      - prisma-client-server:/server/generated/prisma
      - ./server/sockets:/server/sockets
      - ./server/game:/server/game
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      NEXT_PUBLIC_URL: ${NEXT_PUBLIC_URL}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL}
      AUTH_INTERNAL_URL: ${AUTH_INTERNAL_URL}
    # ports:
    #   - "3001:3001"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - transcendence-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.socket.rule=Host(`socket.docker.localhost`)"
      - "traefik.http.routers.socket.entrypoints=websecure"
      - "traefik.http.routers.socket.tls=true"
      - "traefik.http.services.socket.loadbalancer.server.port=3001"


  traefik:
    image: traefik:v3.7
    container_name: traefik
    restart: no
    security_opt:
      - no-new-privileges:true

    networks:
     # Connect to the 'traefik_proxy' overlay network for inter-container communication across nodes
      - transcendence-net

    ports:
      - "80:80"
      - "443:443"

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./certs:/certs:ro
      - ./traefik:/dynamic:ro

    command:
      # EntryPoints
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--entrypoints.web.http.redirections.entrypoint.permanent=true"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.websecure.http.tls=true"

      # Attach the static configuration tls.yaml file that contains the tls configuration settings
      - "--providers.file.filename=/dynamic/tls.yaml"

      # Providers 
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=transcendence-net"

      # API & Dashboard 
      - "--api.dashboard=true"
      - "--api.insecure=false"
      
  # Traefik Dynamic configuration via Docker labels
    labels:
      # Enable self‑routing
      - "traefik.enable=true"

      # Dashboard router
      - "traefik.http.routers.dashboard.rule=Host(`dashboard.docker.localhost`)"
      - "traefik.http.routers.dashboard.entrypoints=websecure"
      - "traefik.http.routers.dashboard.service=api@internal"
      - "traefik.http.routers.dashboard.tls=true"


volumes:
  db-data:
  next-modules:
  server-modules:
  prisma-client-app:
  prisma-client-server:

networks:
  transcendence-net:
